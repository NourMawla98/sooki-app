<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cart Solo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  html, body { margin:0; padding:0; font-family:'DM Sans', sans-serif; }
  * { box-sizing: border-box; }
  body { display:flex; align-items:flex-start; justify-content:center; min-height: 100vh; padding: 12px 0; }
  body.dark  { background: #0a0a18; }
  body.light { background: #f3eee7; }
  .scaler { transform: scale(0.56); transform-origin: top center; }
  .phone-content-scope ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes auroraBarShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
  @keyframes cartShimmer { 0% { transform: translateX(-120%); } 60% { transform: translateX(340%); } 100% { transform: translateX(340%); } }
  @keyframes cartFloat { 0%,100% { transform: translateY(-6px) rotate(-4deg); } 50% { transform: translateY(6px) rotate(4deg); } }
  @keyframes cartGentlePulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes fabPulse { 0%,100% { transform: translateX(-50%) scale(1);} 50% { transform: translateX(-50%) scale(1.06);} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../frames/ios-frame.jsx?v=3"></script>
<script type="text/babel" src="../../cart/cart-screen.jsx?v=3"></script>
<script type="text/babel">
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') === 'light' ? 'light' : 'dark';
  document.body.classList.add(theme);
  const App = () => (
    <div className="scaler">
      <IOSDevice width={402} height={874} dark={theme === 'dark'}>
        <div className="phone-content-scope" style={{ width:'100%', height:'100%' }}>
          <CartScreen theme={theme} tweaks={{ promoApplied: true }} />
        </div>
      </IOSDevice>
    </div>
  );
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
